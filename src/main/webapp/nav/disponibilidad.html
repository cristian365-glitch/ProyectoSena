    <section id="habitaciones" class="habitaciones">
        <h2>Todos nuestros Alojamientos</h2>
        <p class="hab-subtitle">Descubre tu refugio perfecto</p>

        <!-- Barra de búsqueda -->
        <div class="barra-busqueda">
            <div class="input-group">
                <label>Entrada</label>
                <input type="date" id="fechaEntrada">
            </div>
            <div class="input-group">
                <label>Salida</label>
                <input type="date" id="fechaSalida">
            </div>
            <div class="input-group">
                <label>Huéspedes</label>
                <select id="numHuespedes">
                    <option value="0">Cualquiera</option>
                    <option value="2">2 personas</option>
                    <option value="4">4 personas</option>
                    <option value="6">6 personas</option>
                    <option value="8">8+ personas</option>
                </select>
            </div>
            <div class="input-group">
                <label>Precio máximo</label>
                <select id="precioMax">
                    <option value="">Sin límite</option>
                    <option value="200000">$200,000</option>
                    <option value="300000">$300,000</option>
                    <option value="500000">$500,000</option>
                </select>
            </div>
            <button class="btn-buscar" onclick="aplicarFiltros()">Buscar</button>
        </div>

        <!-- Filtros rápidos -->
        <div class="barra-filtros-rapidos">
            <button class="chip active" data-tipo="experiencia" data-valor="todas" onclick="toggleChip(this, 'experiencia', 'todas')">Todas</button>
            <button class="chip" data-tipo="experiencia" data-valor="bosque" onclick="toggleChip(this, 'experiencia', 'bosque')">🌲 Bosque</button>
            <button class="chip" data-tipo="experiencia" data-valor="mar" onclick="toggleChip(this, 'experiencia', 'mar')">🌊 Mar</button>
            <button class="chip" data-tipo="experiencia" data-valor="campo" onclick="toggleChip(this, 'experiencia', 'campo')">🌾 Campo</button>
            
            <span class="divisor">|</span>
            
            <button class="chip" data-tipo="servicio" data-valor="wifi" onclick="toggleChip(this, 'servicio', 'wifi')">WiFi</button>
            <button class="chip" data-tipo="servicio" data-valor="aire_acondicionado" onclick="toggleChip(this, 'servicio', 'aire_acondicionado')">Aire acondicionado</button>
            <button class="chip" data-tipo="servicio" data-valor="tv" onclick="toggleChip(this, 'servicio', 'tv')">TV</button>
            <button class="chip" data-tipo="servicio" data-valor="minibar" onclick="toggleChip(this, 'servicio', 'minibar')">Minibar</button>
            <button class="chip" data-tipo="servicio" data-valor="balcon" onclick="toggleChip(this, 'servicio', 'balcon')">Balcón</button>
            
            <span class="divisor">|</span>
            
            <button class="chip chip-reset" onclick="limpiarTodo()">Limpiar</button>
        </div>

        <!-- Contador de resultados -->
        <div class="contador-resultados">
            <span id="contador">Cargando...</span>
        </div>

        <!-- LOADER -->
        <div id="loader" class="loader-container">
            <div class="loader"></div>
            <p>Cargando habitaciones...</p>
        </div>

        <!-- Grid de habitaciones -->
        <div id="habitaciones-container" class="habitaciones-grid" style="display: none;"></div>
    </section>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;           
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .habitaciones {
            margin: 40px auto;
            text-align: center;
            padding: 0 5%;
            max-width: 1400px;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            color: #1a1a1a;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 20px;
            font-weight: 400;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #b8860b);
            transform: translateX(-50%);
        }

        .hab-subtitle {
            text-align: center;
            font-size: 1.15rem;
            color: #666;
            margin-bottom: 50px;
            font-family: 'Lato', sans-serif;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 20px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-container p {
            color: #666;
            font-size: 1rem;
        }

        .barra-busqueda {
            display: flex;
            align-items: stretch;
            background: white;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
            gap: 0;
            overflow-x: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
            min-width: 140px;
            justify-content: center;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
            font-family: 'Lato', sans-serif;
        }

        .input-group input, .input-group select {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: #333;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            font-family: 'Lato', sans-serif;
        }

        .btn-buscar {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-buscar:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .barra-filtros-rapidos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 30px 0;
            align-items: center;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #ddd;
            background: white;
            color: #666;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
        }

        .chip:hover {
            border-color: #d4af37;
            transform: translateY(-2px);
        }

        .chip.active {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            border-color: #d4af37;
        }

        .chip-reset {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .chip-reset:hover {
            background: #d32f2f;
            border-color: #d32f2f;
        }

        .divisor {

            font-size: 1.5rem;
        }

        .contador-resultados {
            text-align: center;

            font-size: 1.1rem;
            color: #666;
            font-weight: 500;

        .habitaciones-grid {

        .habitacion-card {

            overflow: hidden;

            cursor: pointer;

        .habitacion-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .habitacion-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .habitacion-info {
            padding: 16px;
        }

        .experiencia-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .experiencia-badge.bosque { background: #2d5016; color: white; }
        .experiencia-badge.mar { background: #1e5a8e; color: white; }
        .experiencia-badge.campo { background: #8b7355; color: white; }

        /* Requisito 3: Tamaños específicos y centrado */
        .habitacion-info h3 {
            font-size: 18.4px;
            margin: 8px 0;
            color: #1a1a1a;
            text-align: center;

        }

        /* Requisito 1 y 3: Descripción con máximo 2 líneas y centrada */
        .habitacion-descripcion {

            font-size: 14.4px;
            margin: 8px 0 12px;
            line-height: 1.4;
            text-align: center;
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            /* Limitar a 2 líneas */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 40px; /* Para mantener altura consistente */
        }

        /* Requisito 4 y 5: Sin saltos de línea, todo en la misma línea, alineado a la izquierda */
        .habitacion-detalles {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            padding-top: 12px;

        }

            align-items: baseline;
            gap: 4px;
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .detalle-item strong {
            color: #1a1a1a;
            font-size: 14.4px;
            font-weight: 600;
        }

        .detalle-item span {
            color: #999;
            font-size: 14.4px;
            font-weight: 400;
        }

        .btn-reservar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }

        .btn-reservar:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .barra-busqueda {
                flex-direction: column;
                border-radius: 20px;
            }

            .input-group {
                min-width: 100%;
            }

            .habitaciones-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        // ✅ VARIABLES GLOBALES OPTIMIZADAS
        let habitacionesOriginal = [];
        let reservasExistentes = [];
        let filtros = {
            experiencia: 'todas',
            servicios: [],
            fechaEntrada: null,
            fechaSalida: null,
            numHuespedes: 0,
            precioMax: Infinity
        };

        // 🚀 CONFIGURACIÓN DE RENDIMIENTO
        const CONFIG = {
            DEBUG: false
        };

        // ⚡ INICIO OPTIMIZADO
        window.addEventListener('DOMContentLoaded', async () => {
            const startTime = performance.now();
            
            try {
                // Cargar habitaciones y reservas en paralelo
                await Promise.all([
                    cargarHabitaciones(),
                    cargarReservas()
                ]);
                
                const loadTime = performance.now() - startTime;
                if (CONFIG.DEBUG) console.log(`✅ Carga completada en ${loadTime.toFixed(0)}ms`);
                
            } catch (error) {
                console.error('❌ Error en carga inicial:', error);
                mostrarError();
            }
        });

        // ✅ CARGAR TODAS LAS HABITACIONES - SIN LIMITACIÓN
        async function cargarHabitaciones() {
            try {
                const response = await fetch('../ObtenerHabitacionesServlet');
                const data = await response.json();
                
                // Cargar TODAS las habitaciones sin filtro
                habitacionesOriginal = Array.isArray(data) ? data : [];
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('habitaciones-container').style.display = 'grid';
                
                mostrarHabitaciones(habitacionesOriginal);
                actualizarContador(habitacionesOriginal.length);
                
            } catch (error) {
                console.error('Error al cargar habitaciones:', error);
                throw error;
            }
        }

        async function cargarReservas() {
            try {
                const response = await fetch('../ObtenerReservaServlet');
                const data = await response.json();
                
                reservasExistentes = Array.isArray(data) ? data : [];
                
                if (CONFIG.DEBUG) console.log(`📊 ${reservasExistentes.length} reservas cargadas`);
                
            } catch (error) {
                console.error('Error al cargar reservas:', error);
                reservasExistentes = [];
            }
        }

        function aplicarFiltros() {
            filtros.fechaEntrada = document.getElementById('fechaEntrada').value || null;
            filtros.fechaSalida = document.getElementById('fechaSalida').value || null;
            filtros.numHuespedes = parseInt(document.getElementById('numHuespedes').value) || 0;
            filtros.precioMax = parseInt(document.getElementById('precioMax').value) || Infinity;
            ejecutarFiltrado();
        }

        function toggleChip(elemento, tipo, valor) {
            if (tipo === 'experiencia') {
                document.querySelectorAll('[data-tipo="experiencia"]').forEach(chip => {
                    chip.classList.remove('active');
                });
                elemento.classList.add('active');
                filtros.experiencia = valor;
                
            } else if (tipo === 'servicio') {
                elemento.classList.toggle('active');
                
                if (elemento.classList.contains('active')) {
                    if (!filtros.servicios.includes(valor)) {
                        filtros.servicios.push(valor);
                    }
                } else {
                    filtros.servicios = filtros.servicios.filter(s => s !== valor);
                }
            }
            
            ejecutarFiltrado();
        }

        // ⚡ FILTRADO OPTIMIZADO
        function ejecutarFiltrado() {
            const startTime = performance.now();
            
            const resultado = habitacionesOriginal.filter(hab => {
                // Experiencia
                if (filtros.experiencia !== 'todas' && hab.experiencia !== filtros.experiencia) {
                    return false;
                }
                
                // Precio
                if (hab.precio_noche > filtros.precioMax) {
                    return false;
                }
                
                // Capacidad
                if (filtros.numHuespedes > 0 && hab.capacidad < filtros.numHuespedes) {
                    return false;
                }
                
                // Disponibilidad
                if (filtros.fechaEntrada && filtros.fechaSalida) {
                    if (!estaDisponible(hab.id, filtros.fechaEntrada, filtros.fechaSalida)) {
                        return false;
                    }
                }
                
                // Servicios
                for (let servicio of filtros.servicios) {
                    if (Number(hab[servicio]) !== 1) {
                        return false;
                    }
                }
                
                return true;
            });
            
            if (CONFIG.DEBUG) {
                const filterTime = performance.now() - startTime;
                console.log(`🔍 Filtrado en ${filterTime.toFixed(0)}ms: ${resultado.length}/${habitacionesOriginal.length}`);
            }
            
            mostrarHabitaciones(resultado);
            actualizarContador(resultado.length);
        }

        function estaDisponible(habId, entrada, salida) {
            const fechaEntrada = new Date(entrada);
            const fechaSalida = new Date(salida);
            
            return !reservasExistentes.some(reserva => {
                if (reserva.habitacion_id !== habId || reserva.estado === 'cancelada') {
                    return false;
                }
                
                const resEntrada = new Date(reserva.fecha_checkin);
                const resSalida = new Date(reserva.fecha_checkout);
                
                return (
                    (fechaEntrada >= resEntrada && fechaEntrada < resSalida) ||
                    (fechaSalida > resEntrada && fechaSalida <= resSalida) ||
                    (fechaEntrada <= resEntrada && fechaSalida >= resSalida)
                );
            });
        }

        function limpiarTodo() {
            document.getElementById('fechaEntrada').value = '';
            document.getElementById('fechaSalida').value = '';
            document.getElementById('numHuespedes').value = '0';
            document.getElementById('precioMax').value = '';
            
            document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
            document.querySelector('[data-valor="todas"]').classList.add('active');
            
            filtros = {
                experiencia: 'todas',
                servicios: [],
                fechaEntrada: null,
                fechaSalida: null,
                numHuespedes: 0,
                precioMax: Infinity
            };
            
            mostrarHabitaciones(habitacionesOriginal);
            actualizarContador(habitacionesOriginal.length);
        }

        // ⚡ RENDERIZADO OPTIMIZADO
        function mostrarHabitaciones(habitaciones) {
            const container = document.getElementById('habitaciones-container');
            container.innerHTML = '';

            if (habitaciones.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">No hay habitaciones que coincidan con los filtros seleccionados</p>';
                return;
            }

            habitaciones.forEach((hab, index) => {
                const card = document.createElement('div');
                card.className = 'habitacion-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.onclick = () => verDetalle(hab.id);

                const icono =
                    hab.experiencia === 'mar' ? '🌊' :
                    hab.experiencia === 'campo' ? '🌾' :
                    '🌲';

                // Requisito 1: Limitar descripción a aproximadamente 2 líneas (80 caracteres)
                let descripcion = hab.descripcion || 'Descubre esta experiencia única';
                if (descripcion.length > 80) {
                    descripcion = descripcion.substring(0, 80) + '...';
                }

                // Requisito 4: Formato sin saltos de línea - todo en una línea
                card.innerHTML = `
                    <img loading="lazy" src="${hab.imagen_principal}" alt="${hab.nombre}">

                    <div class="habitacion-info">
                        <span class="experiencia-badge ${hab.experiencia}">
                            ${icono} ${hab.experiencia.toUpperCase()}
                        </span>

                        <h3>${hab.nombre}</h3>

                        <p class="habitacion-descripcion">${descripcion}</p>

                        <div class="habitacion-detalles">
                            <div class="detalle-item">
                                <strong>👥 ${hab.capacidad} Personas</strong>
                            </div>
                            <div class="detalle-item">
                                <strong>$${Number(hab.precio_noche).toLocaleString('es-CO')}</strong> <span>por noche</span>
                            </div>
                        </div>

                        <button class="btn-reservar" onclick="event.stopPropagation(); reservar(${hab.id})">
                            Ver más detalles
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function actualizarContador(cantidad) {
            const texto = cantidad === 0 ? 'No hay resultados' :
                         cantidad === 1 ? '1 habitación disponible' :
                         `${cantidad} habitaciones disponibles`;
            document.getElementById('contador').textContent = texto;
        }

        function reservar(id) {
            if (auth && auth.usuario && !auth.esAdmin) {
                window.location.href = `../login/detalle-habitacion.html?id=${id}`;
            } else if (auth && auth.esAdmin) {
                alert('Los administradores no pueden hacer reservas');
            } else {
                alert('Debes iniciar sesión para ver más detalles');
                window.location.href = '../login/Login.html';
            }
        }

        function verDetalle(id) {
            window.location.href = `../login/detalle-habitacion.html?id=${id}`;
        }

        function mostrarError() {
            document.getElementById('loader').innerHTML = `
                <div style="text-align: center; color: #999;">
                    <h3>⚠️ Error al cargar</h3>
                    <p>No se pudieron cargar las habitaciones. Por favor, recarga la página.</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; 
                        background: #d4af37; color: white; border: none; border-radius: 8px; cursor: pointer;">
                        🔄 Recargar
                    </button>
                </div>
            `;
        }

        // MENÚ MÓVIL
        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        const authMobile = document.getElementById('auth-mobile');
        
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', function() {
                menuToggle.classList.toggle('active');
                mobileMenu.classList.toggle('active');
                document.body.classList.toggle('menu-open');
                
                const authContainer = document.getElementById('auth-container');
                if (authContainer && authMobile) {
                    authMobile.innerHTML = authContainer.innerHTML;
                }
            });

            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function() {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    document.body.classList.remove('menu-open');
                });
            });

            document.addEventListener('click', function(event) {
                if (!mobileMenu.contains(event.target) && 
                    !menuToggle.contains(event.target) && 
                    mobileMenu.classList.contains('active')) {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    document.body.classList.remove('menu-open');
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    document.body.classList.remove('menu-open');
                }
            });
        }
    </script>
</body>
</html>
