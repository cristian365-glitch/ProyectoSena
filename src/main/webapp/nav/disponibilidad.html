    <script>
        /* ==================== VARIABLES GLOBALES ==================== */
        
        /**
         * Array con todas las habitaciones cargadas del servidor
         * Sirve como fuente original de datos
         */
        let habitacionesOriginal = [];
        
        /**
         * Array con las reservas existentes para verificar disponibilidad
         * Cada reserva tiene: habitacion_id, fecha_checkin, fecha_checkout, estado
         */
        let reservasExistentes = [];
        
        /**
         * Objeto que mantiene el estado actual de todos los filtros
         * Se actualiza cuando el usuario interactúa con los controles
         */
        let filtros = {
            experiencia: 'todas',    // 'todas', 'bosque', 'mar', 'campo'
            fechaEntrada: null,      // String formato 'YYYY-MM-DD'
            fechaSalida: null,       // String formato 'YYYY-MM-DD'
            numHuespedes: 0,        // Número mínimo de personas
            precioMax: Infinity,     // Precio máximo por noche
            servicios: []            // Array: ['wifi', 'balcon', etc]
        };

        /* ==================== INICIALIZACIÓN ==================== */
        
        /**
         * Se ejecuta cuando el DOM está listo
         * Carga datos iniciales y configura validaciones
         */
        document.addEventListener('DOMContentLoaded', function() {
            cargarDatos();
            configurarFechas();
        });

        /**
         * Carga habitaciones y reservas desde el servidor
         * Ejecuta las peticiones de forma asíncrona
         */
        async function cargarDatos() {
            try {
                // Carga habitaciones
                const respHab = await fetch('../ObtenerHabitacionesServlet');
                habitacionesOriginal = await respHab.json();
                
                // Carga reservas para filtro de disponibilidad
                try {
                    const respRes = await fetch('../ObtenerReservaServlet');
                    reservasExistentes = await respRes.json();
                } catch(e) {
                    console.warn('⚠️ No se pudieron cargar reservas');
                    reservasExistentes = [];
                }
                
                // Muestra las habitaciones
                mostrarHabitaciones(habitacionesOriginal);
                actualizarContador(habitacionesOriginal.length);
                
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('habitaciones-container').innerHTML = 
                    '<p style="text-align: center; color: #c53030; padding: 40px;">Error al cargar habitaciones</p>';
            }
        }

        /**
         * Configura validación de fechas
         * - Fecha mínima es hoy
         * - Salida debe ser después de entrada
         */
        function configurarFechas() {
            const hoy = new Date().toISOString().split('T')[0];
            const inputEntrada = document.getElementById('fechaEntrada');
            const inputSalida = document.getElementById('fechaSalida');
            
            inputEntrada.min = hoy;
            inputSalida.min = hoy;
            
            // Cuando cambia entrada, actualiza mínimo de salida
            inputEntrada.addEventListener('change', function() {
                if (this.value) {
                    const minSalida = new Date(this.value);
                    minSalida.setDate(minSalida.getDate() + 1);
                    inputSalida.min = minSalida.toISOString().split('T')[0];
                    
                    if (inputSalida.value && inputSalida.value <= this.value) {
                        inputSalida.value = '';
                    }
                }
            });
        }

        /* ==================== FUNCIONES DE FILTRADO ==================== */
        
        /**
         * Aplica los filtros de la barra de búsqueda principal
         * Lee valores de inputs y ejecuta filtrado completo
         */
        function aplicarFiltros() {
            // Lee valores de la barra de búsqueda
            filtros.fechaEntrada = document.getElementById('fechaEntrada').value;
            filtros.fechaSalida = document.getElementById('fechaSalida').value;
            filtros.numHuespedes = parseInt(document.getElementById('numHuespedes').value) || 0;
            filtros.precioMax = parseInt(document.getElementById('precioMax').value) || Infinity;
            
            // Ejecuta filtrado
            ejecutarFiltrado();
        }

        /**
         * Maneja clic en chips de experiencia (Todas, Bosque, Mar, Campo)
         * Solo uno puede estar activo a la vez
         * 
         * @param {Element} elemento - El botón chip clickeado
         * @param {string} tipo - Tipo de filtro ('experiencia')
         * @param {string} valor - Valor del filtro ('todas', 'bosque', etc)
         */
        function toggleChip(elemento, tipo, valor) {
            // Desactiva todos los chips de experiencia
            document.querySelectorAll('[data-tipo="experiencia"]').forEach(chip => {
                chip.classList.remove('active');
            });
            
            // Activa el chip clickeado
            elemento.classList.add('active');
            
            // Actualiza filtro y ejecuta
            filtros.experiencia = valor;
            ejecutarFiltrado();
        }

        /**
         * Maneja clic en chips de servicio (WiFi, A/C, Balcón, Vista)
         * Pueden estar activos múltiples a la vez (toggle)
         * 
         * @param {Element} elemento - El botón chip clickeado
         * @param {string} servicio - Nombre del servicio ('wifi', 'balcon', etc)
         */
       function toggleServicioChip(elemento, servicio) {
    // Toggle de estado activo
    elemento.classList.toggle('active');
    
    // Actualiza array de servicios
    if (elemento.classList.contains('active')) {
        // Agregar servicio si no está
        if (!filtros.servicios.includes(servicio)) {
            filtros.servicios.push(servicio);
        }
    } else {
        // Remover servicio
        filtros.servicios = filtros.servicios.filter(s => s !== servicio);
    }

    console.log("Filtros de servicios actuales: ", filtros.servicios); // Verificación
    // Ejecutar filtrado
    ejecutarFiltrado();
}


        /**
         * FUNCIÓN PRINCIPAL DE FILTRADO
         * Aplica todos los filtros activos simultáneamente
         * Combina criterios usando AND lógico
         */
        function ejecutarFiltrado() {
            console.log('🔍 Filtros activos:', filtros);
            
            // Filtra el array original con todos los criterios
            let resultado = habitacionesOriginal.filter(hab => {
                
                // FILTRO 1: Experiencia (bosque, mar, campo)
                if (filtros.experiencia !== 'todas' && hab.experiencia !== filtros.experiencia) {
                    return false;
                }
                
                // FILTRO 2: Precio máximo
                if (hab.precio_noche > filtros.precioMax) {
                    return false;
                }
                
                // FILTRO 3: Capacidad mínima
                if (filtros.numHuespedes > 0 && hab.capacidad < filtros.numHuespedes) {
                    return false;
                }
                
                // FILTRO 4: Disponibilidad por fechas
                if (filtros.fechaEntrada && filtros.fechaSalida) {
                    if (!estaDisponible(hab.id, filtros.fechaEntrada, filtros.fechaSalida)) {
                        return false;
                    }
                }
                
// FILTRO 5: Servicios (debe tener TODOS los seleccionados)
for (let servicio of filtros.servicios) {
    if (Number(hab[servicio]) !== 1) {
        return false;
    }
}


                
                // Pasa todos los filtros
                return true;
            });
            
            // Muestra resultados
            mostrarHabitaciones(resultado);
            actualizarContador(resultado.length);
        }

        /**
         * Verifica si una habitación está disponible en las fechas dadas
         * Compara con reservas existentes para detectar conflictos
         * 
         * @param {number} habId - ID de la habitación
         * @param {string} entrada - Fecha entrada 'YYYY-MM-DD'
         * @param {string} salida - Fecha salida 'YYYY-MM-DD'
         * @returns {boolean} true si disponible, false si hay conflicto
         */
        function estaDisponible(habId, entrada, salida) {
            const fechaEntrada = new Date(entrada);
            const fechaSalida = new Date(salida);
            
            // Busca conflictos con reservas existentes
            const hayConflicto = reservasExistentes.some(reserva => {
                // Solo verifica esta habitación
                if (reserva.habitacion_id !== habId) return false;
                
                // Solo reservas activas
                if (reserva.estado === 'cancelada') return false;
                
                const resEntrada = new Date(reserva.fecha_checkin);
                const resSalida = new Date(reserva.fecha_checkout);
                
                // Detecta solapamiento de fechas
                // Hay conflicto si:
                // - Nueva entrada cae durante reserva existente
                // - Nueva salida cae durante reserva existente
                // - Nueva reserva engloba la existente
                return (
                    (fechaEntrada >= resEntrada && fechaEntrada < resSalida) ||
                    (fechaSalida > resEntrada && fechaSalida <= resSalida) ||
                    (fechaEntrada <= resEntrada && fechaSalida >= resSalida)
                );
            });
            
            return !hayConflicto;
        }

        /**
         * Limpia todos los filtros y vuelve al estado inicial
         * Resetea tanto inputs como chips
         */
        function limpiarTodo() {
            // Limpia inputs de búsqueda
            document.getElementById('fechaEntrada').value = '';
            document.getElementById('fechaSalida').value = '';
            document.getElementById('numHuespedes').value = '0';
            document.getElementById('precioMax').value = '';
            
            // Resetea chips de experiencia
            document.querySelectorAll('[data-tipo="experiencia"]').forEach(chip => {
                chip.classList.remove('active');
            });
            document.querySelector('[data-valor="todas"]').classList.add('active');
            
            // Desactiva chips de servicios
            document.querySelectorAll('[data-tipo="servicio"]').forEach(chip => {
                chip.classList.remove('active');
            });
            
            // Resetea objeto de filtros
            filtros = {
                experiencia: 'todas',
                fechaEntrada: null,
                fechaSalida: null,
                numHuespedes: 0,
                precioMax: Infinity,
                servicios: []
            };
            
            // Muestra todo
            mostrarHabitaciones(habitacionesOriginal);
            actualizarContador(habitacionesOriginal.length);
        }

        /* ==================== FUNCIONES DE VISUALIZACIÓN ==================== */
        
        /**
         * Renderiza las tarjetas de habitaciones en el grid
         * Crea elementos HTML dinámicamente
         * 
         * @param {Array} habitaciones - Array de habitaciones a mostrar
         */
        function mostrarHabitaciones(habitaciones) {
            const container = document.getElementById('habitaciones-container');
            container.innerHTML = '';
            
            if (habitaciones.length === 0) {
                container.innerHTML = `
                    <p style="grid-column: 1/-1; text-align: center; color: #999; padding: 60px 20px;">
                        No se encontraron habitaciones 😔<br>
                        <small>Intenta ajustar los filtros</small>
                    </p>
                `;
                return;
            }
            
            habitaciones.forEach(hab => {
                const card = document.createElement('div');
                card.className = 'habitacion-card';
                card.onclick = () => verDetalle(hab.id);
                
                const icono = hab.experiencia === 'bosque' ? '🌲' : 
                             hab.experiencia === 'mar' ? '🌊' : '🌾';
                
                card.innerHTML = `
                    <img src="${hab.imagen_principal || 'recursos/placeholder.jpg'}" alt="${hab.nombre}">
                    <div class="habitacion-info">
                        <span class="experiencia-badge ${hab.experiencia}">${icono} ${hab.experiencia.toUpperCase()}</span>
                        <h3>${hab.nombre}</h3>
                        <p class="habitacion-descripcion">${hab.descripcion ? (hab.descripcion.substring(0, 80) + '...') : 'Experiencia única'}</p>
                        <div class="habitacion-detalles">
                            <div class="detalle-item">
                                <strong>👥 ${hab.capacidad}</strong>
                                <span>Personas</span>
                            </div>
                            <div class="detalle-item">
                                <strong>$${hab.precio_noche.toLocaleString('es-CO')}</strong>
                                <span>por noche</span>
                            </div>
                        </div>
                        <button class="btn-reservar" onclick="event.stopPropagation(); reservar(${hab.id})">
                            Ver detalles
                        </button>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        /**
         * Actualiza el contador de resultados
         * 
         * @param {number} cantidad - Número de habitaciones encontradas
         */
        function actualizarContador(cantidad) {
            const texto = cantidad === 0 ? 'No hay resultados' :
                         cantidad === 1 ? '1 habitación disponible' :
                         `${cantidad} habitaciones disponibles`;
            document.getElementById('contador').textContent = texto;
        }

        /* ==================== NAVEGACIÓN ==================== */
        
        function reservar(id) {
            if (auth && auth.usuario && !auth.esAdmin) {
                window.location.href = `../login/logindetalle-habitacion.html?id=${id}`;
            } else if (auth && auth.esAdmin) {
                alert('Los administradores no pueden hacer reservas');
            } else {
                alert('Debes iniciar sesión');
                window.location.href = '../login/Login.html';
            }
        }

        function verDetalle(id) {
            window.location.href = `../login/detalle-habitacion.html?id=${id}`;
        }
    </script>
</body>
</html>
