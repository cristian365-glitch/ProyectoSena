<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Pendiente - Hotel Armonía</title>
    <link rel="stylesheet" href="indexCSS.css">
        <link rel="apple-touch-icon" sizes="180x180" href="../recursos/imagen icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../recursos/imagen icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../recursos/imagen icon/favicon-16x16.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .confirmacion-container {
            max-width: 700px;
            margin: 140px auto 60px;
            padding: 0 20px;
        }

        .pendiente-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .pendiente-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .pendiente-icon::before {
            content: "⏳";
            font-size: 50px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            color: #f59e0b;
            margin: 0 0 15px 0;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            margin: 10px 0;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 16px 50px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b8860b, #9a7209);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <ul>
            <li class="logo">
                <a href="index.html">
                    <img src="recursos/logo armonia n1.png" width="85px" alt="logo">
                </a>
            </li>
            <li><a href="index.html">INICIO</a></li>
            <li><a href="/nav/Experiencias.html">EXPERIENCIAS</a></li>
            <li><a href="/nav/Hoteles.html">HOTELES</a></li>
        </ul>
    </header>

    <div class="confirmacion-container">
        <div class="pendiente-card">
            <div class="pendiente-icon"></div>
            <h1>Pago Pendiente</h1>
            <p>Tu pago está siendo procesado.</p>
            <p>Te notificaremos por email cuando se confirme.</p>
            <p style="margin-top: 20px; color: #999; font-size: 0.95rem;">
                Esto puede tardar algunos minutos. Si tienes dudas, contáctanos.
            </p>
            
            <a href="index.html" class="btn">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
