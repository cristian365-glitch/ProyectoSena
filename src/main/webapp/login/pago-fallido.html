<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Fallido - Hotel Armonía</title>
    <link rel="stylesheet" href="indexCSS.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .confirmacion-container {
            max-width: 700px;
            margin: 140px auto 60px;
            padding: 0 20px;
        }

        .error-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .error-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .error-icon::before {
            content: "✕";
            color: white;
            font-size: 50px;
            font-weight: bold;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            color: #ef4444;
            margin: 0 0 15px 0;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            margin: 10px 0;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 16px 40px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #374151;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            border-color: #d4af37;
            color: #d4af37;
        }
    </style>
</head>
<body>
    <header>
        <ul>
            <li class="logo">
                <a href="index.html">
                    <img src="recursos/logo armonia n1.png" width="85px" alt="logo">
                </a>
            </li>
            <li><a href="index.html">INICIO</a></li>
            <li><a href="/nav/Experiencias.html">EXPERIENCIAS</a></li>
            <li><a href="/nav/Hoteles.html">HOTELES</a></li>
        </ul>
    </header>

    <div class="confirmacion-container">
        <div class="error-card">
            <div class="error-icon"></div>
            <h1>Pago Rechazado</h1>
            <p>No se pudo procesar tu pago.</p>
            <p>Por favor intenta con otro método de pago o verifica los datos de tu tarjeta.</p>
            
            <a href="javascript:history.back()" class="btn btn-primary">Intentar de Nuevo</a>
            <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
