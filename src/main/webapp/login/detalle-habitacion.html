<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Habitación - Hotel Armonía</title>
    <link rel="stylesheet" href="../indexCSS.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="auth-ui.css">
    <script src="auth-session.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #fafbfc 0%, #f0f2f5 50%, #e8ecf0 100%);
            font-family: 'Inter', sans-serif;
        }

        .detalle-container {
            max-width: 1400px;
            margin: 140px auto 80px;
            padding: 0 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 40px;
            padding: 12px 24px;
            border-radius: 50px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .back-btn:hover {
            color: #d4af37;
            transform: translateX(-5px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        /* GALERÍA MEJORADA */
        .galeria {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 50px;
            border-radius: 20px;
            overflow: hidden;
        }

        .imagen-principal {
            position: relative;
            height: 600px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        .imagen-principal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .imagen-principal:hover img {
            transform: scale(1.08);
        }

        .imagen-principal::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .imagen-principal:hover::after {
            opacity: 1;
        }

        .imagenes-secundarias {
            display: grid;
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
        }

        .imagen-secundaria {
            position: relative;
            height: 290px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .imagen-secundaria img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .imagen-secundaria:hover img {
            transform: scale(1.08);
        }

        .ver-todas {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.9rem;
        }

        .ver-todas:hover {
            background: #d4af37;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        /* CONTENIDO MEJORADO */
        .habitacion-contenido {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 50px;
            background: white;
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        .info-principal h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .experiencia-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .experiencia-tag.bosque { 
            background: linear-gradient(135deg, #2d5016, #4a7c2a); 
        }
        .experiencia-tag.mar { 
            background: linear-gradient(135deg, #1e88e5, #1565c0); 
        }
        .experiencia-tag.campo { 
            background: linear-gradient(135deg, #558b2f, #7cb342); 
        }

        .descripcion {
            color: #4a5568;
            line-height: 1.9;
            margin-bottom: 40px;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* DETALLES RÁPIDOS MEJORADOS */
        .detalles-rapidos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            padding: 30px 0;
            margin: 30px 0;
            border-top: 2px solid #f0f0f0;
            border-bottom: 2px solid #f0f0f0;
        }

        .detalle-quick {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #fafbfc, #f8f9fa);
            border-radius: 15px;
            transition: all 0.3s;
            border: 1px solid #e8ecf0;
        }

        .detalle-quick:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
        }

        .detalle-quick strong {
            display: block;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .detalle-quick span {
            color: #718096;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* INFORMACIÓN DE CAMAS */
        #camas-info {
            margin: 30px 0;
            padding: 25px;
            background: linear-gradient(135deg, #f8f9fa, #f0f2f5);
            border-radius: 15px;
            border-left: 4px solid #d4af37;
            display: none;
        }

        #camas-info strong {
            font-size: 1.1rem;
            color: #2c3e50;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #camas-texto {
            color: #4a5568;
            font-weight: 500;
        }

        /* COMODIDADES MEJORADAS */
        #comodidades-container {
            margin: 40px 0;
        }

        #comodidades-container h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #1a1a1a;
        }

        #comodidades-lista {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .comodidad-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 18px;
            background: white;
            border-radius: 12px;
            border: 2px solid #f0f0f0;
            transition: all 0.3s;
        }

        .comodidad-item:hover {
            border-color: #d4af37;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.1);
        }

        .comodidad-item span:first-child {
            font-size: 1.4rem;
        }

        .comodidad-item span:last-child {
            color: #4a5568;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* PANEL DE RESERVA MEJORADO */
        .panel-reserva {
            background: linear-gradient(135deg, #ffffff, #fafbfc);
            padding: 40px;
            border-radius: 25px;
            height: fit-content;
            position: sticky;
            top: 120px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            border: 1px solid #f0f0f0;
        }

        .precio-contenedor {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .precio-destacado {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            line-height: 1;
        }

        .precio-destacado small {
            font-size: 1.1rem;
            color: #718096;
            font-weight: 400;
            display: block;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-reservar-grande {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-reservar-grande::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-reservar-grande:hover::before {
            left: 100%;
        }

        .btn-reservar-grande:hover {
            background: linear-gradient(135deg, #b8860b, #9a7209);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.5);
        }

        .btn-reservar-grande:active {
            transform: translateY(-1px);
        }

        .garantias {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #f0f0f0;
        }

        .garantia-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #4a5568;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .garantia-item:last-child {
            margin-bottom: 0;
        }

        .garantia-item::before {
            content: '✓';
            color: #48bb78;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* MODAL MEJORADO */
        .modal-galeria {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.97);
            z-index: 10000;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .modal-galeria.active {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 95%;
            max-height: 90%;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .cerrar-modal {
            position: absolute;
            top: 30px;
            right: 50px;
            color: white;
            font-size: 50px;
            cursor: pointer;
            z-index: 10001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .cerrar-modal:hover {
            background: rgba(255,255,255,0.2);
            transform: rotate(90deg);
        }

        .navegacion-galeria {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            transform: translateY(-50%);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 18px 24px;
            font-size: 28px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: rgba(212, 175, 55, 0.8);
            border-color: #d4af37;
            transform: scale(1.1);
        }

        /* MENSAJES DE ERROR Y CARGA */
        .error-message {
            background: linear-gradient(135deg, #fee, #fdd);
            color: #c62828;
            padding: 30px;
            border-radius: 15px;
            margin: 40px 0;
            text-align: center;
            border: 2px solid #ffcdd2;
        }

        .error-message h3 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        .error-message button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .error-message button:hover {
            background: #b8860b;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.3rem;
            color: #718096;
            font-weight: 500;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .habitacion-contenido {
                gap: 40px;
                padding: 40px;
            }

            .info-principal h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .detalle-container {
                margin: 100px auto 40px;
                padding: 0 20px;
            }

            .galeria {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .imagen-principal {
                height: 400px;
            }

            .imagenes-secundarias {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: 1fr;
            }

            .imagen-secundaria {
                height: 200px;
            }

            .habitacion-contenido {
                grid-template-columns: 1fr;
                padding: 30px 20px;
                gap: 30px;
            }

            .info-principal h1 {
                font-size: 2rem;
            }

            .panel-reserva {
                position: static;
                padding: 30px;
            }

            #comodidades-lista {
                grid-template-columns: 1fr;
            }

            .detalles-rapidos {
                grid-template-columns: repeat(2, 1fr);
            }

            .cerrar-modal {
                top: 20px;
                right: 20px;
                font-size: 40px;
            }

            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <header>
        <ul>
            <li class="logo">
                <a href="../index.html">
                    <img src="../recursos/logo armonia n1.png" width="89px" alt="logo">
                </a>
            </li>

            <li><a href="../nav/disponibilidad.html">Habitaciones</a></li>
            <li><a href="../nav/experiencias.html">Experiencias</a></li>
            <li><a href="../nav/servicios.html">Servicios</a></li>

            <li class="registro" id="auth-container"></li>
        </ul>
    </header>

    <div class="detalle-container">
        <a href="../nav/disponibilidad.html" class="back-btn">
            <span>←</span> Volver a habitaciones
        </a>

        <div id="loading" class="loading">Cargando habitación</div>

        <div class="galeria" id="galeria" style="display: none;"></div>

        <div class="habitacion-contenido" id="contenido-habitacion" style="display: none;">
            <div class="info-principal">
                <h1 id="nombre-habitacion"></h1>
                <span id="experiencia-badge" class="experiencia-tag"></span>
                
                <p id="descripcion" class="descripcion"></p>

                <div class="detalles-rapidos">
                    <div class="detalle-quick">
                        <strong>👥 <span id="capacidad">-</span></strong>
                        <span>Personas</span>
                    </div>
                    <div class="detalle-quick" id="metros-container" style="display: none;">
                        <strong>📐 <span id="metros">-</span>m²</strong>
                        <span>Superficie</span>
                    </div>
                    <div class="detalle-quick" id="vista-container" style="display: none;">
                        <strong>🏞️ <span id="vista">-</span></strong>
                        <span>Vista</span>
                    </div>
                </div>

                <div id="camas-info">
                    <strong>🛏️ Camas:</strong> <span id="camas-texto"></span>
                </div>

                <div id="comodidades-container">
                    <h3>Comodidades incluidas</h3>
                    <div id="comodidades-lista"></div>
                </div>
            </div>

            <div class="panel-reserva">
                <div class="precio-contenedor">
                    <div class="precio-destacado">
                        $<span id="precio">0</span>
                        <small>por noche</small>
                    </div>
                </div>
                
                <button class="btn-reservar-grande" onclick="iniciarReserva()">
                    Reservar Ahora
                </button>

                <div class="garantias">
                    <div class="garantia-item">Cancelación gratuita</div>
                    <div class="garantia-item">Mejor precio garantizado</div>
                    <div class="garantia-item">Confirmación inmediata</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-galeria" id="modalGaleria">
        <span class="cerrar-modal" onclick="cerrarModal()">×</span>
        <div class="navegacion-galeria">
            <button class="nav-btn" onclick="cambiarImagen(-1)">‹</button>
            <button class="nav-btn" onclick="cambiarImagen(1)">›</button>
        </div>
        <div class="modal-content">
            <img id="imagenModal" src="" alt="">
        </div>
    </div>

    <script>
        let habitacion = null;
        let imagenes = [];
        let imagenActual = 0;

        document.addEventListener('DOMContentLoaded', async function() {
            const params = new URLSearchParams(window.location.search);
            const habitacionId = params.get('id');

            if (!habitacionId) {
                mostrarError('No se especificó ID de habitación');
                setTimeout(() => {
                    window.location.href = 'disponibilidad.html';
                }, 2000);
                return;
            }

            await cargarHabitacion(habitacionId);
        });

        async function cargarHabitacion(id) {
            try {
                console.log('🔍 Cargando habitación con ID:', id);
                
                const response = await fetch(`../DetalleHabitacionServlet?id=${id}`);
                
                console.log('📡 Response status:', response.status);
                console.log('📋 Content-Type:', response.headers.get('content-type'));

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    const text = await response.text();
                    console.error('❌ Respuesta recibida (no es JSON):', text.substring(0, 500));
                    throw new TypeError("El servidor no devolvió JSON válido");
                }

                habitacion = await response.json();
                console.log('✅ Habitación cargada:', habitacion);

                if (!habitacion || habitacion.error) {
                    throw new Error(habitacion?.error || 'Habitación no encontrada');
                }

                mostrarHabitacion();
                
            } catch (error) {
                console.error('❌ Error completo:', error);
                mostrarError('Error al cargar la habitación: ' + error.message);
            }
        }

        function mostrarError(mensaje) {
            document.getElementById('loading').innerHTML = `
                <div class="error-message">
                    <h3>⚠️ Error</h3>
                    <p>${mensaje}</p>
                    <button onclick="window.location.href='disponibilidad.html'">
                        Volver a habitaciones
                    </button>
                </div>
            `;
        }

        function mostrarHabitacion() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('galeria').style.display = 'grid';
            document.getElementById('contenido-habitacion').style.display = 'grid';

            document.getElementById('nombre-habitacion').textContent = habitacion.nombre;
            document.getElementById('descripcion').textContent = habitacion.descripcion || 'Disfruta de una experiencia única en esta magnífica habitación.';
            document.getElementById('capacidad').textContent = habitacion.capacidad;
            document.getElementById('precio').textContent = habitacion.precio_noche.toLocaleString('es-CO');

            if (habitacion.metros_cuadrados) {
                document.getElementById('metros').textContent = habitacion.metros_cuadrados;
                document.getElementById('metros-container').style.display = 'block';
            }

            if (habitacion.vista) {
                document.getElementById('vista').textContent = habitacion.vista;
                document.getElementById('vista-container').style.display = 'block';
            }

            if (habitacion.camas_info) {
                document.getElementById('camas-texto').textContent = habitacion.camas_info;
                document.getElementById('camas-info').style.display = 'block';
            }

            const icono = habitacion.experiencia === 'bosque' ? '🌲' : 
                         habitacion.experiencia === 'mar' ? '🌊' : '🌾';
            
            const badge = document.getElementById('experiencia-badge');
            badge.textContent = icono + ' ' + habitacion.experiencia.toUpperCase();
            badge.className = 'experiencia-tag ' + habitacion.experiencia;

            const comodidades = [];
            if (habitacion.wifi) comodidades.push({ icono: '📶', texto: 'WiFi gratuito' });
            if (habitacion.aire_acondicionado) comodidades.push({ icono: '❄️', texto: 'Aire acondicionado' });
            if (habitacion.tv) comodidades.push({ icono: '📺', texto: 'TV' });
            if (habitacion.minibar) comodidades.push({ icono: '🍷', texto: 'Minibar' });
            if (habitacion.balcon) comodidades.push({ icono: '🪟', texto: 'Balcón' });
            if (habitacion.desayuno_incluido) comodidades.push({ icono: '🍳', texto: 'Desayuno incluido' });

            const listaComodidades = document.getElementById('comodidades-lista');
            listaComodidades.innerHTML = '';
            comodidades.forEach(com => {
                const div = document.createElement('div');
                div.className = 'comodidad-item';
                div.innerHTML = `<span>${com.icono}</span> <span>${com.texto}</span>`;
                listaComodidades.appendChild(div);
            });

            imagenes = habitacion.imagenes || [];
            if (imagenes.length === 0 && habitacion.imagen_principal) {
                imagenes.push({ url_cloudinary: habitacion.imagen_principal });
            }

            mostrarGaleria();
        }

        function mostrarGaleria() {
            const galeria = document.getElementById('galeria');
            galeria.innerHTML = '';

            if (imagenes.length === 0) {
                galeria.innerHTML = '<p style="padding: 40px; text-align: center; color: #999;">No hay imágenes disponibles</p>';
                return;
            }

            const principal = document.createElement('div');
            principal.className = 'imagen-principal';
            principal.onclick = () => abrirModal(0);
            principal.innerHTML = `<img src="${imagenes[0].url_cloudinary}" alt="Imagen principal">`;
            galeria.appendChild(principal);

            if (imagenes.length > 1) {
                const secundarias = document.createElement('div');
                secundarias.className = 'imagenes-secundarias';

                for (let i = 1; i < Math.min(imagenes.length, 3); i++) {
                    const img = document.createElement('div');
                    img.className = 'imagen-secundaria';
                    img.onclick = () => abrirModal(i);
                    img.innerHTML = `<img src="${imagenes[i].url_cloudinary}" alt="Imagen ${i + 1}">`;
                    
                    if (i === 2 && imagenes.length > 3) {
                        img.innerHTML += `<div class="ver-todas" onclick="event.stopPropagation(); abrirModal(0)">Ver todas (${imagenes.length})</div>`;
                    }
                    
                    secundarias.appendChild(img);
                }

                galeria.appendChild(secundarias);
            }
        }

        function abrirModal(index) {
            imagenActual = index;
            document.getElementById('imagenModal').src = imagenes[imagenActual].url_cloudinary;
            document.getElementById('modalGaleria').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modalGaleria').classList.remove('active');
        }

        function cambiarImagen(direccion) {
            imagenActual += direccion;
            if (imagenActual < 0) imagenActual = imagenes.length - 1;
            if (imagenActual >= imagenes.length) imagenActual = 0;
            document.getElementById('imagenModal').src = imagenes[imagenActual].url_cloudinary;
        }

        function iniciarReserva() {
            if (typeof auth !== 'undefined' && auth && auth.usuario && !auth.esAdmin) {
                window.location.href = `reservar.html?habitacion=${habitacion.id}`;
            } else if (typeof auth !== 'undefined' && auth && auth.esAdmin) {
                alert('Los administradores no pueden hacer reservas');
            } else {
                if (confirm('Debes iniciar sesión para reservar. ¿Deseas ir al login?')) {
                    window.location.href = 'Login.html';
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModal();
            }
        });
    </script>
</body>
</html>
