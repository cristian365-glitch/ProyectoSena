<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Habitación - Hotel Armonía</title>
    <link rel="stylesheet" href="../indexCSS.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../recursos/imagen icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../recursos/imagen icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../recursos/imagen icon/favicon-16x16.png">
    <link rel="stylesheet" href="auth-ui.css">
    <script src="auth-session.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            font-family: 'Inter', sans-serif;
            color: #e8e8e8;
            overflow-x: hidden;
        }

        /* ANIMACIONES DE APARICIÓN */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .detalle-container {
            max-width: 1600px;
            margin: 120px auto 80px;
            padding: 0 40px;
            animation: fadeIn 0.6s ease-out;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 50px;
            padding: 14px 28px;
            border-radius: 50px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            transform: translateX(-8px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
        }

        .back-btn::before {
            content: '←';
            font-size: 1.3rem;
            transition: transform 0.4s;
        }

        .back-btn:hover::before {
            transform: translateX(-4px);
        }

        /* GALERÍA PREMIUM */
        .galeria {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 60px;
            animation: fadeInUp 0.7s ease-out 0.2s both;
        }

        .imagen-principal {
            position: relative;
            height: 650px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .imagen-principal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: brightness(0.95);
        }

        .imagen-principal:hover img {
            transform: scale(1.1);
            filter: brightness(1);
        }

        .imagen-principal::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .imagen-principal:hover::after {
            opacity: 1;
        }

        .imagenes-secundarias {
            display: grid;
            grid-template-rows: repeat(2, 1fr);
            gap: 24px;
        }

        .imagen-secundaria {
            position: relative;
            height: 313px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .imagen-secundaria img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: brightness(0.95);
        }

        .imagen-secundaria:hover img {
            transform: scale(1.1);
            filter: brightness(1);
        }

        .ver-todas {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(212, 175, 55, 0.95);
            backdrop-filter: blur(20px);
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            color: #0a0a0a;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .ver-todas:hover {
            background: #d4af37;
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.5);
        }

        /* CONTENIDO PREMIUM */
        .habitacion-contenido {
            display: grid;
            grid-template-columns: 1.6fr 1.4fr;
            gap: 60px;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.8), rgba(20, 20, 20, 0.9));
            padding: 70px;
            border-radius: 32px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .info-principal h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #b8941f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            line-height: 1.2;
            letter-spacing: -1px;
            animation: shimmer 3s infinite;
            background-size: 2000px 100%;
        }

        .experiencia-tag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #0a0a0a;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .experiencia-tag.bosque { 
            background: linear-gradient(135deg, #4a7c2a, #6db33f); 
        }
        .experiencia-tag.mar { 
            background: linear-gradient(135deg, #1e88e5, #42a5f5); 
        }
        .experiencia-tag.campo { 
            background: linear-gradient(135deg, #7cb342, #9ccc65); 
        }

        .descripcion {
            color: #c8c8c8;
            line-height: 2;
            margin-bottom: 45px;
            font-size: 1.15rem;
            font-weight: 400;
        }

        /* DETALLES RÁPIDOS PREMIUM */
        .detalles-rapidos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 24px;
            padding: 40px 0;
            margin: 40px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .detalle-quick {
            text-align: center;
            padding: 28px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.05));
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .detalle-quick:hover {
            transform: translateY(-6px);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.1));
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .detalle-quick .icono {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .detalle-quick .valor {
            font-size: 2rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 6px;
            display: block;
        }

        .detalle-quick .label {
            font-size: 0.9rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
        }

        /* CAMAS INFO */
        .camas-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.05));
            border-radius: 16px;
            margin-bottom: 35px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .camas-info .icono {
            font-size: 1.8rem;
        }

        .camas-info .texto {
            color: #c8c8c8;
            font-size: 1.05rem;
            font-weight: 500;
        }

        /* COMODIDADES PREMIUM */
        .comodidades h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #d4af37;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .comodidades-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .comodidad-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(212, 175, 55, 0.02));
            border-radius: 14px;
            transition: all 0.3s;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .comodidad-item:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.12), rgba(212, 175, 55, 0.08));
            transform: translateX(6px);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .comodidad-item span:first-child {
            font-size: 1.5rem;
        }

        .comodidad-item span:last-child {
            color: #c8c8c8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* TARJETA DE RESERVA PREMIUM */
        .tarjeta-reserva {
            position: sticky;
            top: 140px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.08));
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.25);
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .precio-container {
            text-align: center;
            margin-bottom: 50px;
            padding: 35px 0;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
        }

        .precio-valor {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #b8941f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            line-height: 1;
            letter-spacing: -2px;
        }

        .precio-periodo {
            font-size: 1.1rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .btn-reservar {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.4);
            margin-bottom: 30px;
        }

        .btn-reservar:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
        }

        .btn-reservar:active {
            transform: translateY(-2px);
        }

        .garantias {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .garantia-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c8c8c8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .garantia-item::before {
            content: '✓';
            color: #d4af37;
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* MODAL GALERÍA */
        .modal-galeria {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-galeria.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .cerrar-modal {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 3rem;
            color: #d4af37;
            cursor: pointer;
            z-index: 10001;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
        }

        .cerrar-modal:hover {
            transform: rotate(90deg);
            background: rgba(212, 175, 55, 0.2);
        }

        .navegacion-galeria {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10001;
        }

        .nav-btn {
            background: rgba(212, 175, 55, 0.9);
            border: none;
            color: #0a0a0a;
            font-size: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: #d4af37;
            transform: scale(1.1);
        }

        /* ERROR MESSAGE */
        .error-message {
            text-align: center;
            padding: 80px 40px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 24px;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .error-message h3 {
            font-size: 2rem;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .error-message p {
            color: #c8c8c8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .error-message button {
            padding: 16px 32px;
            background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .error-message button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .habitacion-contenido {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .tarjeta-reserva {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .detalle-container {
                padding: 0 20px;
                margin-top: 100px;
            }

            .galeria {
                grid-template-columns: 1fr;
            }

            .imagen-principal {
                height: 400px;
            }

            .info-principal h1 {
                font-size: 2.5rem;
            }

            .precio-valor {
                font-size: 3rem;
            }

            .habitacion-contenido {
                padding: 40px 30px;
            }

            .comodidades-grid {
                grid-template-columns: 1fr;
            }

            .detalles-rapidos {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="detalle-container">
        <a href="disponibilidad.html" class="back-btn">Volver a habitaciones</a>

        <div class="galeria" id="galeria"></div>

        <div class="habitacion-contenido" id="contenido-habitacion">
            <div class="info-principal">
                <h1 id="nombre-habitacion">Cargando...</h1>
                
                <div id="experiencia-badge" class="experiencia-tag"></div>

                <p class="descripcion" id="descripcion"></p>

                <div class="detalles-rapidos">
                    <div class="detalle-quick">
                        <span class="icono">👥</span>
                        <span class="valor" id="capacidad">-</span>
                        <span class="label">Personas</span>
                    </div>
                    
                    <div class="detalle-quick" id="metros-container" style="display: none;">
                        <span class="icono">📐</span>
                        <span class="valor" id="metros">-</span>
                        <span class="label">m²</span>
                    </div>
                    
                    <div class="detalle-quick" id="vista-container" style="display: none;">
                        <span class="icono">🪟</span>
                        <span class="valor" id="vista">-</span>
                        <span class="label">Vista</span>
                    </div>
                </div>

                <div class="camas-info" id="camas-info" style="display: none;">
                    <span class="icono">🛏️</span>
                    <span class="texto">Camas: <strong id="camas-texto"></strong></span>
                </div>

                <div class="comodidades">
                    <h3>Comodidades incluidas</h3>
                    <div class="comodidades-grid" id="comodidades-lista"></div>
                </div>
            </div>

            <div class="tarjeta-reserva">
                <div class="precio-container">
                    <div class="precio-valor">$<span id="precio">0</span></div>
                    <div class="precio-periodo">por noche</div>
                </div>

                <button class="btn-reservar" onclick="iniciarReserva()">
                    Reservar Ahora
                </button>

                <div class="garantias">
                    <div class="garantia-item">Cancelación gratuita</div>
                    <div class="garantia-item">Mejor precio garantizado</div>
                    <div class="garantia-item">Confirmación inmediata</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-galeria" id="modalGaleria">
        <span class="cerrar-modal" onclick="cerrarModal()">×</span>
        <div class="navegacion-galeria">
            <button class="nav-btn" onclick="cambiarImagen(-1)">‹</button>
            <button class="nav-btn" onclick="cambiarImagen(1)">›</button>
        </div>
        <div class="modal-content">
            <img id="imagenModal" src="" alt="">
        </div>
    </div>

    <script>
        let habitacion = null;
        let imagenes = [];
        let imagenActual = 0;

        document.addEventListener('DOMContentLoaded', async function() {
            const params = new URLSearchParams(window.location.search);
            const habitacionId = params.get('id');

            if (!habitacionId) {
                mostrarError('No se especificó ID de habitación');
                setTimeout(() => {
                    window.location.href = 'disponibilidad.html';
                }, 2000);
                return;
            }

            await cargarHabitacion(habitacionId);
        });

        async function cargarHabitacion(id) {
            try {
                console.log('🔍 Cargando habitación con ID:', id);
                
                const response = await fetch(`../DetalleHabitacionServlet?id=${id}`);
                
                console.log('📡 Response status:', response.status);
                console.log('📋 Content-Type:', response.headers.get('content-type'));

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    const text = await response.text();
                    console.error('❌ Respuesta recibida (no es JSON):', text.substring(0, 500));
                    throw new TypeError("El servidor no devolvió JSON válido");
                }

                habitacion = await response.json();
                console.log('✅ Habitación cargada:', habitacion);

                if (!habitacion || habitacion.error) {
                    throw new Error(habitacion?.error || 'Habitación no encontrada');
                }

                mostrarHabitacion();
                
            } catch (error) {
                console.error('❌ Error completo:', error);
                mostrarError('Error al cargar la habitación: ' + error.message);
            }
        }

        function mostrarError(mensaje) {
            const container = document.querySelector('.detalle-container');
            container.innerHTML = `
                <div class="error-message">
                    <h3>⚠️ Error</h3>
                    <p>${mensaje}</p>
                    <button onclick="window.location.href='disponibilidad.html'">
                        Volver a habitaciones
                    </button>
                </div>
            `;
        }

        function mostrarHabitacion() {
            document.getElementById('nombre-habitacion').textContent = habitacion.nombre;
            document.getElementById('descripcion').textContent = habitacion.descripcion || 'Disfruta de una experiencia única en esta magnífica habitación.';
            document.getElementById('capacidad').textContent = habitacion.capacidad;
            document.getElementById('precio').textContent = habitacion.precio_noche.toLocaleString('es-CO');

            if (habitacion.metros_cuadrados) {
                document.getElementById('metros').textContent = habitacion.metros_cuadrados;
                document.getElementById('metros-container').style.display = 'block';
            }

            if (habitacion.vista) {
                document.getElementById('vista').textContent = habitacion.vista;
                document.getElementById('vista-container').style.display = 'block';
            }

            if (habitacion.camas_info) {
                document.getElementById('camas-texto').textContent = habitacion.camas_info;
                document.getElementById('camas-info').style.display = 'flex';
            }

            const icono = habitacion.experiencia === 'bosque' ? '🌲' : 
                         habitacion.experiencia === 'mar' ? '🌊' : '🌾';
            
            const badge = document.getElementById('experiencia-badge');
            badge.textContent = icono + ' ' + habitacion.experiencia.toUpperCase();
            badge.className = 'experiencia-tag ' + habitacion.experiencia;

            const comodidades = [];
            if (habitacion.wifi) comodidades.push({ icono: '📶', texto: 'WiFi gratuito' });
            if (habitacion.aire_acondicionado) comodidades.push({ icono: '❄️', texto: 'Aire acondicionado' });
            if (habitacion.tv) comodidades.push({ icono: '📺', texto: 'TV' });
            if (habitacion.minibar) comodidades.push({ icono: '🍷', texto: 'Minibar' });
            if (habitacion.balcon) comodidades.push({ icono: '🪟', texto: 'Balcón' });
            if (habitacion.desayuno_incluido) comodidades.push({ icono: '🍳', texto: 'Desayuno incluido' });

            const listaComodidades = document.getElementById('comodidades-lista');
            listaComodidades.innerHTML = '';
            comodidades.forEach(com => {
                const div = document.createElement('div');
                div.className = 'comodidad-item';
                div.innerHTML = `<span>${com.icono}</span> <span>${com.texto}</span>`;
                listaComodidades.appendChild(div);
            });

            imagenes = habitacion.imagenes || [];
            if (imagenes.length === 0 && habitacion.imagen_principal) {
                imagenes.push({ url_cloudinary: habitacion.imagen_principal });
            }

            mostrarGaleria();
        }

        function mostrarGaleria() {
            const galeria = document.getElementById('galeria');
            galeria.innerHTML = '';

            if (imagenes.length === 0) {
                galeria.innerHTML = '<p style="padding: 40px; text-align: center; color: #999;">No hay imágenes disponibles</p>';
                return;
            }

            const principal = document.createElement('div');
            principal.className = 'imagen-principal';
            principal.onclick = () => abrirModal(0);
            principal.innerHTML = `<img src="${imagenes[0].url_cloudinary}" alt="Imagen principal" loading="lazy">`;
            galeria.appendChild(principal);

            if (imagenes.length > 1) {
                const secundarias = document.createElement('div');
                secundarias.className = 'imagenes-secundarias';

                for (let i = 1; i < Math.min(imagenes.length, 3); i++) {
                    const img = document.createElement('div');
                    img.className = 'imagen-secundaria';
                    img.onclick = () => abrirModal(i);
                    img.innerHTML = `<img src="${imagenes[i].url_cloudinary}" alt="Imagen ${i + 1}" loading="lazy">`;
                    
                    if (i === 2 && imagenes.length > 3) {
                        img.innerHTML += `<div class="ver-todas" onclick="event.stopPropagation(); abrirModal(0)">Ver todas (${imagenes.length})</div>`;
                    }
                    
                    secundarias.appendChild(img);
                }

                galeria.appendChild(secundarias);
            }
        }

        function abrirModal(index) {
            imagenActual = index;
            document.getElementById('imagenModal').src = imagenes[imagenActual].url_cloudinary;
            document.getElementById('modalGaleria').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modalGaleria').classList.remove('active');
            document.body.style.overflow = '';
        }

        function cambiarImagen(direccion) {
            imagenActual += direccion;
            if (imagenActual < 0) imagenActual = imagenes.length - 1;
            if (imagenActual >= imagenes.length) imagenActual = 0;
            document.getElementById('imagenModal').src = imagenes[imagenActual].url_cloudinary;
        }

        function iniciarReserva() {
            if (typeof auth !== 'undefined' && auth && auth.usuario && !auth.esAdmin) {
                window.location.href = `reservar.html?habitacion=${habitacion.id}`;
            } else if (typeof auth !== 'undefined' && auth && auth.esAdmin) {
                alert('Los administradores no pueden hacer reservas');
            } else {
                if (confirm('Debes iniciar sesión para reservar. ¿Deseas ir al login?')) {
                    window.location.href = 'Login.html';
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModal();
            }
        });
    </script>
</body>
</html>
